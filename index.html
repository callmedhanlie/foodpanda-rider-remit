<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Standard Meta Tags -->
    <title>Panda Rider Remittance Calculator</title>
    <meta name="description" content="Quickly calculate your Foodpanda remittance, net income, and wallet balance after tax.">
    <meta name="author" content="Panda Rider Tools">

    <!-- Social Media: Open Graph (Facebook, Messenger, WhatsApp, Viber) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-vercel-link.vercel.app/"> <!-- Replace with your actual link -->
    <meta property="og:title" content="foodpanda | Rider Remittance Calculator">
    <meta property="og:description" content="Calculate your exact cash turnover and net income after 2% tax. Built for Panda Riders.">
    <meta property="og:image" content="https://your-vercel-link.vercel.app/og-image.png"> <!-- Use a link to a logo here -->

    <!-- Social Media: Twitter (X) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Panda Rider Remittance Calculator">
    <meta name="twitter:description" content="Calculate your remittance and net income instantly.">
    <meta name="twitter:image" content="https://your-vercel-link.vercel.app/og-image.png">

    <!-- Mobile App / PWA Meta Tags (Add to Home Screen) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Panda Calc">
    <meta name="theme-color" content="#D70F64"> <!-- Official Panda Pink -->

    <!-- Favicon / Icon -->
    <link rel="icon" type="image/png" href="https://www.foodpanda.ph/favicon.ico">
    <link rel="apple-touch-icon" href="https://www.foodpanda.ph/favicon.ico">

    <!-- Styles & Scripts -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #F7F7F7; }
        .bg-panda { background-color: #D70F64; }
        .text-panda { color: #D70F64; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        input:focus { border-color: #D70F64 !important; outline: none; box-shadow: 0 0 0 3px rgba(215, 15, 100, 0.1); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-white shadow-sm py-4 px-6">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-[#D70F64] font-bold text-2xl tracking-tighter italic">foodpanda</span>
                <span class="ml-2 text-gray-300 font-light">|</span>
                <span class="ml-2 text-gray-600 font-semibold text-xs uppercase tracking-widest">Rider Tools</span>
            </div>
        </div>
    </header>

    <main class="flex-grow px-4 py-6">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-panda h-2"></div>
            
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-1">Remittance Calc</h2>
                <p class="text-sm text-gray-500 mb-6">Real-time calculator for daily shift settlement.</p>
                
                <form hx-post="/api/calculate" 
                      hx-target="#result" 
                      hx-trigger="keyup delay:200ms, change" 
                      class="space-y-4">
                    
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Delivery Fee (Base)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-gray-400">₱</span>
                            <input type="number" step="0.01" inputmode="decimal" name="fee" placeholder="0.00" 
                                class="w-full border border-gray-200 rounded-xl p-3 pl-7 bg-gray-50 font-semibold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Quest</label>
                            <div class="relative">
                                <span class="absolute left-3 top-3 text-gray-400">₱</span>
                                <input type="number" step="0.01" inputmode="decimal" name="quest" placeholder="0.00" 
                                    class="w-full border border-gray-200 rounded-xl p-3 pl-7 bg-gray-50 font-semibold">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Tips (100%)</label>
                            <div class="relative">
                                <span class="absolute left-3 top-3 text-gray-400">₱</span>
                                <input type="number" step="0.01" inputmode="decimal" name="tip" placeholder="0.00" 
                                    class="w-full border border-gray-200 rounded-xl p-3 pl-7 bg-gray-50 font-semibold">
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <label class="text-[10px] font-bold text-panda uppercase tracking-wider mb-1 block text-center">Cash in Wallet (Total Balance)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-3.5 text-gray-400 text-lg">₱</span>
                            <input type="number" step="0.01" inputmode="decimal" name="wallet" placeholder="0.00" 
                                class="w-full border-2 border-gray-100 rounded-xl p-4 pl-9 bg-gray-50 font-bold text-gray-800 text-xl text-center focus:bg-white transition-all">
                        </div>
                    </div>
                </form>

                <div id="result">
                    <div class="mt-8 py-8 px-4 text-center bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                        <p class="text-gray-400 text-sm italic">Enter your shift totals above...</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center pb-8 text-gray-400 text-[10px] uppercase tracking-widest leading-loose">
        <p>2% Tax deducted from Fees & Quest</p>
        <p>© 2024 Panda Rider Assistant</p>
    </footer>

</body>
</html>
