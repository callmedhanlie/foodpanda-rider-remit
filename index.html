<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Primary Meta Tags -->
    <title>foodpanda | Rider</title>
    <meta name="title" content="foodpanda | Rider Remit Calc">
    <meta name="description" content="Quickly calculate your daily remittance, net income (minus 2% tax), and wallet balance. Built specifically for foodpanda riders.">

    <!-- Open Graph / Facebook / Messenger / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://foodpanda-rider-remit.vercel.app/">
    <meta property="og:title" content="foodpanda | Rider Remit Calc">
    <meta property="og:description" content="Calculate your shift remittance instantly. Rounded up for easier payment at 7-Eleven or GCash.">
    <meta property="og:image" content="https://images.deliveryhero.io/image/foodpanda/logo-fb.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://foodpanda-rider-remit.vercel.app/">
    <meta property="twitter:title" content="foodpanda | Rider Remit Calc">
    <meta property="twitter:description" content="Quick shift settlement tool for riders.">
    <meta property="twitter:image" content="https://images.deliveryhero.io/image/foodpanda/logo-fb.png">

    <!-- Mobile App & PWA (Add to Home Screen) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Panda Remit">
    <meta name="theme-color" content="#D70F64">

    <!-- Icons -->
    <link rel="icon" type="image/png" href="https://www.foodpanda.ph/favicon.ico">
    <link rel="apple-touch-icon" href="https://www.foodpanda.ph/favicon.ico">

    <!-- HTMX, Tailwind, & Fonts -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #F7F7F7; }
        .bg-panda { background-color: #D70F64; }
        .text-panda { color: #D70F64; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        input:focus { border-color: #D70F64 !important; outline: none; box-shadow: 0 0 0 3px rgba(215, 15, 100, 0.1); }
        
        /* Prevents zooming on mobile when tapping inputs */
        @media screen and (max-width: 768px) {
            input { font-size: 16px !important; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- App Bar -->
    <header class="bg-white shadow-sm py-4 px-6 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex items-center">
            <span class="text-[#D70F64] font-bold text-2xl tracking-tighter italic">foodpanda</span>
            <span class="ml-2 text-gray-300 font-light">|</span>
            <span class="ml-2 text-gray-600 font-semibold text-xs uppercase tracking-widest">Rider</span>
        </div>
    </header>

    <main class="flex-grow px-4 py-6">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="bg-panda h-2 w-full"></div>
            
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-1 leading-tight">Remittance Tool</h2>
                <p class="text-xs text-gray-500 mb-6 uppercase tracking-wider font-semibold">Shift Settlement Assistant</p>
                
                <form hx-post="/api/calculate" 
                      hx-target="#result" 
                      hx-trigger="keyup delay:200ms, change" 
                      class="space-y-4">
                    
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Delivery Fee (Base)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-gray-400 font-bold">₱</span>
                            <input type="number" step="0.01" inputmode="decimal" name="fee" placeholder="0.00" 
                                class="w-full border border-gray-200 rounded-xl p-3 pl-7 bg-gray-50 font-bold text-gray-700 transition-all focus:bg-white">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Quest</label>
                            <div class="relative">
                                <span class="absolute left-3 top-3 text-gray-400 font-bold">₱</span>
                                <input type="number" step="0.01" inputmode="decimal" name="quest" placeholder="0.00" 
                                    class="w-full border border-gray-200 rounded-xl p-3 pl-7 bg-gray-50 font-bold text-gray-700 transition-all focus:bg-white">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Tips</label>
                            <div class="relative">
                                <span class="absolute left-3 top-3 text-gray-400 font-bold">₱</span>
                                <input type="number" step="0.01" inputmode="decimal" name="tip" placeholder="0.00" 
                                    class="w-full border border-gray-200 rounded-xl p-3 pl-7 bg-gray-50 font-bold text-gray-700 transition-all focus:bg-white">
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <label class="text-[10px] font-bold text-panda uppercase tracking-wider mb-1 block text-center">Wallet Balance (Cash on hand)</label>
                        <div class="relative">
                            <span class="absolute left-4 top-3.5 text-gray-400 text-lg font-bold">₱</span>
                            <input type="number" step="0.01" inputmode="decimal" name="wallet" placeholder="0.00" 
                                class="w-full border-2 border-gray-100 rounded-xl p-4 pl-9 bg-gray-50 font-black text-gray-800 text-xl text-center focus:bg-white focus:border-panda transition-all shadow-inner">
                        </div>
                    </div>
                </form>

                <div id="result">
                    <div class="mt-8 py-10 px-4 text-center bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                        <p class="text-gray-400 text-sm font-medium">Input your earnings to start</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="text-center pb-8 text-gray-400 text-[10px] uppercase tracking-widest leading-loose">
        <p>2% Tax auto-deducted from earnings</p>
        <p>© 2024 foodpanda-rider-remit.vercel.app</p>
    </footer>

</body>
</html>
